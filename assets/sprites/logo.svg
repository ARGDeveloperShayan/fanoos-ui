            <stop offset="45%" stop-color="#ffd257"/>
            <stop offset="100%" stop-color="#ff9430"/>
        </linearGradient>
        <linearGradient id="fg-frame" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6b5133"/>
            <stop offset="100%" stop-color="#332414"/>
