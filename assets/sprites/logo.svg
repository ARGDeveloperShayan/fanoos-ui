<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <radialGradient id="fg-glow" cx="50%" cy="46%" r="50%">
            <stop offset="0%"  stop-color="#ffcf6e" stop-opacity=".85"/>
            <stop offset="45%" stop-color="#ff9d3c" stop-opacity=".32"/>
            <stop offset="100%" stop-color="#ff8a2e" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="fg-glass" cx="50%" cy="52%" r="62%">
            <stop offset="0%"  stop-color="#fff6d8"/>
            <stop offset="48%" stop-color="#ffcf5e"/>
            <stop offset="100%" stop-color="#ff8a2e"/>
        </radialGradient>
        <linearGradient id="fg-flame" x1="0" y1="0" x2="0" y2="1">
