    <path d="M25 46.9 L39 46.9 L37 52.5 L27 52.5 Z" fill="url(#fg-frame)"/>
    <path d="M29.5 52.5 L34.5 52.5 L33.6 55.4 L30.4 55.4 Z" fill="#ffcf6e" opacity=".85"/>

    <circle cx="12" cy="22" r="1.1" fill="#ffd257">
